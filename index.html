<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnfiApp</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2F8;
    --card: #FFFFFF;
    --navy: #1B3A6B;
    --blue: #2D5FA6;
    --blue-light: #4A7EC7;
    --accent: #3B82F6;
    --teal: #0E9F8E;
    --purple: #7C3AED;
    --text-primary: #0F1724;
    --text-secondary: #5A6A82;
    --text-muted: #96A4B8;
    --border: #E2E8F2;
    --shadow-sm: 0 2px 8px rgba(27,58,107,0.08);
    --shadow-md: 0 4px 20px rgba(27,58,107,0.12);
    --shadow-lg: 0 8px 32px rgba(27,58,107,0.16);
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --nav-height: 58px;
    --font: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── SCROLL CONTAINER ── */
  .scroll-area {
    height: 100vh;
    overflow-y: auto;
    padding-bottom: calc(var(--nav-height) + 16px);
    scroll-behavior: smooth;
  }
  .scroll-area::-webkit-scrollbar { display: none; }



  /* ── HEADER ── */
  .header {
    padding: 8px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-logo h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.8px;
    line-height: 1.1;
  }
  .header-logo p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    letter-spacing: -0.2px;
  }
  .header-actions { display: flex; gap: 10px; margin-top: 4px; }
  .header-btn {
    width: 44px; height: 44px;
    background: var(--card);
    border-radius: 50%;
    border: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-size: 18px;
    position: relative;
    transition: transform 0.15s ease;
  }
  .header-btn:active { transform: scale(0.93); }
  .header-btn span.label { font-size: 8px; color: var(--text-secondary); font-weight: 500; }
  .notif-dot {
    position: absolute;
    top: 8px; right: 8px;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--card);
  }

  /* ── HERO CARD ── */
  .hero-card {
    margin: 0 16px;
    background: linear-gradient(135deg, #EBF1FB 0%, #DDEAFB 100%);
    border-radius: var(--radius);
    padding: 22px 20px 0;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .hero-wave {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3));
  }
  .hero-content { display: flex; justify-content: space-between; align-items: flex-end; }
  .hero-text { flex: 1; }
  .hero-emoji { font-size: 26px; margin-bottom: 6px; }
  .hero-text h2 {
    font-size: 19px; font-weight: 700;
    color: var(--navy); letter-spacing: -0.5px; line-height: 1.2;
  }
  .hero-text p {
    font-size: 13.5px; color: var(--text-secondary);
    margin: 6px 0 14px; line-height: 1.4;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--blue); color: #fff;
    font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero-badge svg { width: 12px; height: 12px; }
  .hero-illustration {
    width: 120px; flex-shrink: 0;
    display: flex; align-items: flex-end;
  }
  .nurse-img { width: 130px; object-fit: contain; display: block; filter: drop-shadow(0 6px 16px rgba(27,58,107,0.18)); margin-bottom: -2px; }

  /* ── SECTION CARDS ── */
  .section { padding: 12px 16px 0; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }

  /* ── SEARCH CARD ── */
  .search-card {}
  .search-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .search-icon-wrap {
    width: 42px; height: 42px;
    background: #EEF2F8;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .search-header-text h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }
  .search-header-text p { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }

  .search-input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-input-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted);
  }
  .search-input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 13.5px;
    color: var(--text-primary);
    background: #F8FAFD;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(45,95,166,0.1);
    background: #fff;
  }
  .search-btn {
    width: 100%;
    padding: 15px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.15s;
    -webkit-appearance: none;
  }
  .search-btn:active { transform: scale(0.98); background: #142d54; }



  /* ── FAVORITOS ── */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .section-header h3 {
    font-size: 17px; font-weight: 700;
    color: var(--text-primary); letter-spacing: -0.4px;
    display: flex; align-items: center; gap: 6px;
  }
  .see-all {
    font-size: 13px; color: var(--blue); font-weight: 500;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 2px;
  }

  .fav-scroll {
    display: flex; gap: 10px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .fav-scroll::-webkit-scrollbar { display: none; }

  .fav-chip {
    flex-shrink: 0;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    box-shadow: var(--shadow-sm);
    min-width: 140px;
  }
  .fav-chip:active { transform: scale(0.97); }
  .fav-chip.active { border-color: var(--blue); background: #F0F5FF; }
  .fav-chip-icon { font-size: 22px; }
  .fav-chip-text { flex: 1; }
  .fav-chip-text strong { font-size: 12.5px; font-weight: 600; color: var(--text-primary); display: block; line-height: 1.3; }
  .fav-chip-text span { font-size: 10.5px; color: var(--text-muted); }
  .fav-star {
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--text-muted);
    transition: color 0.2s, transform 0.2s;
    padding: 2px;
  }
  .fav-star.starred { color: #F59E0B; }
  .fav-star:active { transform: scale(1.3); }

  /* ── EMPTY FAV ── */
  .fav-empty {
    text-align: center; padding: 24px 16px;
    color: var(--text-muted); font-size: 13px; line-height: 1.5;
  }
  .fav-empty-icon { font-size: 36px; margin-bottom: 8px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    height: var(--nav-height);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(226,232,242,0.8);
    display: flex;
    align-items: center;
    padding: 0 4px;
    z-index: 100;
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    cursor: pointer;
    padding: 4px 2px;
    border-radius: 10px;
    transition: background 0.15s;
    border: none; background: none;
  }
  .nav-item:active { background: #EEF2F8; }
  .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .nav-icon svg { width: 18px; height: 18px; }
  .nav-label { font-size: 9px; font-weight: 500; color: var(--text-muted); letter-spacing: -0.1px; }
  .nav-item.active .nav-label { color: var(--blue); font-weight: 600; }
  .nav-item.active .nav-icon svg { stroke: var(--blue); }
  .nav-item.active .nav-icon .fill-icon { fill: var(--blue); }



  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(var(--nav-height) + 16px); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── DATOS DE FAVORITOS ──
const favData = [
  { id: 1, emoji: '❤️', name: 'Infarto agudo de miocardio', count: 18 },
  { id: 2, emoji: '🫁', name: 'Neumonía', count: 12 },
  { id: 3, emoji: '🧠', name: 'EVC', count: 9 },
  { id: 4, emoji: '🤰', name: 'Preeclampsia', count: 7 },
];

let starred = JSON.parse(localStorage.getItem('enfiapp_starred') || '[]');

function saveStarred() {
  try { localStorage.setItem('enfiapp_starred', JSON.stringify(starred)); } catch(e) {}
}

function renderFavoritos() {
  const container = document.getElementById('favoritosContainer');
  const topFavs = favData.filter(f => starred.includes(f.id));
  const others = favData.filter(f => !starred.includes(f.id));
  const toShow = [...topFavs, ...others].slice(0, 6);

  if (toShow.length === 0) {
    container.innerHTML = `
      <div class="fav-empty">
        <div class="fav-empty-icon">⭐</div>
        <p>Aún no tienes favoritos.<br>Marca diagnósticos para acceder rápido.</p>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="fav-scroll">
      ${toShow.map(f => `
        <div class="fav-chip ${starred.includes(f.id) ? 'active' : ''}" onclick="openDx(${f.id})">
          <span class="fav-chip-icon">${f.emoji}</span>
          <div class="fav-chip-text">
            <strong>${f.name}</strong>
            <span>${f.count} intervenciones</span>
          </div>
          <button class="fav-star ${starred.includes(f.id) ? 'starred' : ''}"
            onclick="toggleStar(event, ${f.id})">
            ${starred.includes(f.id) ? '★' : '☆'}
          </button>
        </div>
      `).join('')}
    </div>`;
}

function toggleStar(e, id) {
  e.stopPropagation();
  if (starred.includes(id)) {
    starred = starred.filter(s => s !== id);
    showToast('☆ Eliminado de favoritos');
  } else {
    starred.push(id);
    showToast('⭐ Agregado a favoritos');
  }
  saveStarred();
  renderFavoritos();
}

function openDx(id) {
  const dx = favData.find(f => f.id === id);
  if (dx) showToast(`🔍 Abriendo: ${dx.name}`);
}

// ── BÚSQUEDA NANDA ──
function buscarNanda() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) {
    showToast('⚠️ Escribe un diagnóstico médico');
    return;
  }
  const query = `Etiqueta diagnóstica NANDA para: ${input}. Dame: 1 etiqueta diagnóstica NANDA, 3 factores relacionados (relacionado con), 3 características definitorias (manifestado por), intervenciones de enfermería NIC y resultados NOC`;
  const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  window.open(url, '_blank');
}

// Enter key en buscador
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarNanda();
});

// ── NAV ──
function setNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
    n.querySelectorAll('svg').forEach(s => s.setAttribute('stroke', '#96A4B8'));
  });
  el.classList.add('active');
  el.querySelectorAll('svg').forEach(s => s.setAttribute('stroke', '#2D5FA6'));
  el.querySelector('.nav-label').style.color = '#2D5FA6';
}

// ── SCROLL TO FAVORITOS ──
function scrollToFavoritos() {
  document.getElementById('favoritos-section').scrollIntoView({ behavior: 'smooth' });
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ──
renderFavoritos();
</script>
